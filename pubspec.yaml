name: ksms
description: Karachi School Management System — multi-tenant, multi-campus school platform.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  supabase_flutter: ^2.8.0
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.1
  intl: any
  uuid: ^4.5.1
  collection: ^1.18.0

  # Offline queue: encrypted AES-GCM entries persisted in secure storage
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3

  connectivity_plus: ^6.0.5
  file_picker: ^8.1.2
  data_table_2: ^2.0.15

  # Printable bilingual PDFs (receipts, report cards, leaving certificates)
  pdf: ^3.11.1
  printing: ^5.13.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
